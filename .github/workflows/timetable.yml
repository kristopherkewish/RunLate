name: Refresh timetable

on:
  # Transport Victoria publishes GTFS Schedule weekly (usually Friday).
  # 20:00 UTC Saturday = early Sunday morning in Melbourne.
  schedule:
    - cron: '0 20 * * 6'
  workflow_dispatch:

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Download GTFS Schedule
        run: |
          # Resolve the current download URL from the portal's CKAN API rather than hard-coding resource IDs.
          url=$(curl -fsS 'https://opendata.transport.vic.gov.au/api/3/action/package_show?id=gtfs-schedule' \
            | jq -r '.result.resources[] | select(.format == "ZIP") | .url' | head -1)
          echo "Downloading $url"
          curl -fsSL --retry 3 -o gtfs.zip "$url"
          mkdir -p gtfs
          unzip -q -o gtfs.zip '1/*' '2/*' -d gtfs
          unzip -q -o gtfs/1/google_transit.zip -d gtfs/vline
          unzip -q -o gtfs/2/google_transit.zip -d gtfs/metro

      - name: Build Footscray timetable
        run: npm run timetable -- --metro gtfs/metro --vline gtfs/vline

      - name: Commit
        id: commit
        run: |
          git add static/timetable
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No timetable changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh Footscray timetable ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
    secrets: inherit
